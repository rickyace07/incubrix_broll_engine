components:
  schemas:
    CaptionsConfig:
      properties:
        burn_in:
          default: true
          title: Burn In
          type: boolean
        srt:
          default: true
          title: Srt
          type: boolean
      title: CaptionsConfig
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobCreateRequest:
      properties:
        aspect_ratios:
          items:
            type: string
          title: Aspect Ratios
          type: array
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
        avoid:
          items:
            type: string
          title: Avoid
          type: array
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
        captions:
          $ref: '#/components/schemas/CaptionsConfig'
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneInput'
            type: array
          - type: 'null'
          title: Scenes
        script:
          anyOf:
          - type: string
          - type: 'null'
          title: Script
        style:
          default: bright, modern, real-world footage
          title: Style
          type: string
        voice:
          default: en-IN-female
          title: Voice
          type: string
      title: JobCreateRequest
      type: object
    SceneInput:
      properties:
        text:
          title: Text
          type: string
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
      required:
      - text
      title: SceneInput
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: Automated B-roll Video Generation Engine matching the IncuBrix Integration
    Standard.
  title: IncuBrix Script to B-roll Video Engine
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/broll/jobs:
    post:
      operationId: create_broll_job_api_v1_broll_jobs_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Broll Job
  /api/v1/broll/jobs/{job_id}:
    get:
      operationId: get_broll_job_api_v1_broll_jobs__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Broll Job
  /health:
    get:
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
  /ready:
    get:
      operationId: ready_check_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready Check
